services:
  name: Sistemas_Distribidos
  db:
    image: postgres:16
    container_name: aula_postgres_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: minhasenha
      POSTGRES_DB: meubanco
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
#      - /meu_caminho_local/dados:/var/lib/postgresql/dataß
volumes:
  pgdata:
